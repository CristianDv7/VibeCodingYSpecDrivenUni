<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taller DAE — Ambiente de Desarrollo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 48px 56px;
      max-width: 560px;
      width: 90%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    .badge {
      display: inline-block;
      background: #14b8a6;
      color: #0f172a;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 12px;
    }

    h1 span { color: #14b8a6; }

    p {
      color: #94a3b8;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .services {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .service {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.875rem;
    }

    .service .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 8px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .footer {
      font-size: 0.75rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Ambiente Local</span>
    <h1>Bienvenido al<br /><span>Taller DAE</span></h1>
    <p>
      El entorno de desarrollo está activo y listo para trabajar.
      Nginx está sirviendo este contenido y puede actuar como proxy
      hacia un backend cuando lo necesites.
    </p>

    <div class="services">
      <div class="service"><span class="dot"></span>Nginx</div>
      <div class="service"><span class="dot"></span>MySQL 8</div>
    </div>

    <p class="footer">Base de datos: <strong>tallerdae</strong> · Puerto DB: 3306 · Puerto Web: 8080</p>
  </div>
</body>
</html>
