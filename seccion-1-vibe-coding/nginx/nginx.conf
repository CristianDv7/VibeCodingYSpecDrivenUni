events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        # -------------------------------------------------
        # Resolver Docker interno para resolución dinámica
        # de hostnames. Evita el fallo al arrancar cuando
        # el backend aún no está disponible.
        # -------------------------------------------------
        resolver 127.0.0.11 valid=10s ipv6=off;

        # -------------------------------------------------
        # Proxy hacia el backend para todas las rutas /api/
        # Se usa variable para forzar resolución DNS lazy.
        # -------------------------------------------------
        location /api/ {
            set $backend_upstream http://backend:8080;
            proxy_pass         $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # -------------------------------------------------
        # Archivos estáticos del frontend (cotizador-frontend)
        # -------------------------------------------------
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
